services:
  backend:
    build:
      context: ./backend
      dockerfile: ../deployments/backend.Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployments/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      - backend
